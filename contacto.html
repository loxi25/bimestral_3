<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">

<header class="bg-slate-950 text-white shadow-lg">
    <nav class="max-w-6xl mx-auto px-6 py-4">
        <div class="flex flex-col md:flex-row md:justify-between gap-4">

            <a href="index.html" class="text-xl font-bold">
            como puedes contactarme
            </a>

            <ul class="flex flex-wrap gap-4">
                <li><a href="index.html" class="hover:text-indigo-400">Inicio</a></li>
                <li><a href="presentacion.html" class="hover:text-indigo-400">Presentación</a></li>
                <li><a href="proyectos.html" class="hover:text-indigo-400">Proyectos</a></li>
                <li><a href="contacto.html" class="text-indigo-400">Contacto</a></li>
            </ul>

        </div>
    </nav>
</header>

<main class="max-w-xl mx-auto p-6">

    <section class="bg-white rounded-2xl shadow-xl p-8">

        <h1 class="text-3xl font-bold text-slate-800 mb-6 text-center">
            Contáctame
        </h1>

        <form class="space-y-4">

            <div>
                <label for="nombre"
                       class="block font-semibold text-slate-700 mb-1">
                    Nombre
                </label>

                <input type="text"
                       id="nombre"
                       name="nombre"
                       class="w-full border border-slate-300 rounded-lg p-3
                              focus:ring-2 focus:ring-indigo-500
                              focus:outline-none">
            </div>

            <div>
                <label for="correo"
                       class="block font-semibold text-slate-700 mb-1">
                    Correo electrónico
                </label>

                <input type="email"
                       id="correo"
                       name="correo"
                       class="w-full border border-slate-300 rounded-lg p-3
                              focus:ring-2 focus:ring-indigo-500
                              focus:outline-none">
            </div>

            <div>
                <label for="mensaje"
                       class="block font-semibold text-slate-700 mb-1">
                    Mensaje
                </label>

                <textarea id="mensaje"
                          name="mensaje"
                          rows="5"
                          class="w-full border border-slate-300 rounded-lg p-3
                                 focus:ring-2 focus:ring-indigo-500
                                 focus:outline-none"></textarea>
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 text-white
                           font-semibold py-3 rounded-lg
                           hover:bg-indigo-700 transition">
                Enviar mensaje
            </button>

        </form>

    </section>

</main>

</body>
</html>
