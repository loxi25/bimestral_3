<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Espacio Personal</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">

    <!-- Barra de navegación -->
    <header class="bg-slate-950 text-white shadow-lg">
        <nav class="max-w-6xl mx-auto px-6 py-4"
             aria-label="Navegación principal">

            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

                <!-- Logo / Inicio -->
                <a href="index.html"
                   class="text-xl font-bold hover:text-indigo-400 transition"
                   aria-label="Ir a la página de inicio">
                    conóceme
                </a>

                <!-- Menú -->
                <ul class="flex flex-wrap gap-4" role="list">

                    <li>
                        <a href="index.html"
                           class="hover:text-indigo-400 transition
                                  focus:outline-none focus:ring-2
                                  focus:ring-indigo-400 rounded px-2 py-1"
                           aria-current="page">
                            Inicio
                        </a>
                    </li>

                    <li>
                        <a href="presentacion.html"
                           class="hover:text-indigo-400 transition
                                  focus:outline-none focus:ring-2
                                  focus:ring-indigo-400 rounded px-2 py-1">
                            Presentación
                        </a>
                    </li>

                    <li>
                        <a href="proyectos.html"
                           class="hover:text-indigo-400 transition
                                  focus:outline-none focus:ring-2
                                  focus:ring-indigo-400 rounded px-2 py-1">
                            Proyectos
                        </a>
                    </li>

                    <li>
                        <a href="contacto.html"
                           class="hover:text-indigo-400 transition
                                  focus:outline-none focus:ring-2
                                  focus:ring-indigo-400 rounded px-2 py-1">
                            Contacto
                        </a>
                    </li>

                </ul>
            </div>
        </nav>
    </header>


    <!-- Contenido principal -->
    <main class="flex justify-center items-center p-6 min-h-[80vh]">

        <section
            class="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full
                   border border-slate-200 text-center"
            aria-labelledby="perfil">

            <!-- Foto de perfil -->
            <div class="relative w-24 h-24 mx-auto mb-4">

                <img
                    src="https://previews.123rf.com/images/doublerdesign/doublerdesign2111/doublerdesign211100154/177923467-coding-programmer-website-company-vector-logo-design.jpg"
                    alt="Imagen de perfil de Oscar Sánchez"
                    class="rounded-full object-cover w-full h-full
                           border-4 border-indigo-500 shadow-md">

                <!-- Indicador de estado -->
                <span
                    class="absolute bottom-1 right-1 w-4 h-4
                           bg-emerald-500 border-2 border-white rounded-full"
                    aria-label="Estado: disponible">
                </span>

            </div>

            <!-- Nombre y profesión -->
            <h1 id="perfil"
                class="text-xl font-bold text-slate-800">
                Óscar Sánchez
            </h1>

            <p class="text-sm font-medium text-indigo-600 mb-3">
                Desarrollador Web
            </p>

            <p class="text-slate-500 text-sm mb-4 leading-relaxed">
                Apasionado por la tecnología y la creación de aplicaciones web.
            </p>

            <!-- Habilidades -->
            <div class="flex justify-center flex-wrap gap-2 mb-6"
                 aria-label="Habilidades">

                <span class="bg-indigo-50 text-indigo-700 text-xs
                             px-3 py-1 rounded-full font-semibold">
                    HTML5
                </span>

                <span class="bg-sky-50 text-sky-700 text-xs
                             px-3 py-1 rounded-full font-semibold">
                    Tailwind CSS
                </span>

                <span class="bg-amber-50 text-amber-700 text-xs
                             px-3 py-1 rounded-full font-semibold">
                    JavaScript
                </span>

            </div>

            <!-- Estadísticas -->
            <div class="grid grid-cols-3 gap-2 bg-slate-50
                        rounded-xl p-3"
                 aria-label="Estadísticas del perfil">

                <div>
                    <span class="block text-indigo-700 font-semibold text-xs">
                        14
                    </span>
                    <span class="text-slate-500 text-xs">
                        Proyectos
                    </span>
                </div>

                <div>
                    <span class="block text-sky-700 font-semibold text-xs">
                        1.2k
                    </span>
                    <span class="text-slate-500 text-xs">
                        Seguidores
                    </span>
                </div>

                <div>
                    <span class="block text-amber-700 font-semibold text-xs">
                        85
                    </span>
                    <span class="text-slate-500 text-xs">
                        Nivel
                    </span>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
```
